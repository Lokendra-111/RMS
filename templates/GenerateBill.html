<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generate Bill</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <!-- Back button -->
    <a href="{{ url_for('dashboard') }}" class="inline-block mb-4 text-blue-600 hover:underline text-xl font-medium">
        ⬅️ Back to Dashboard
    </a>

    <div class="max-w-3xl mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-3xl font-bold mb-2 text-center">🍴 My Restaurant</h1>
        <h2 class="text-xl text-gray-600 mb-6 text-center">🧾 Bill / Receipt</h2>

        <!-- Table number input -->
        <div class="mb-6 text-center">
            <label for="tableNumber" class="mr-2 font-medium text-gray-700">Enter Table Number:</label>
            <input type="number" id="tableNumber" min="1" placeholder="Table #" class="border rounded px-3 py-1 w-24">
            <button onclick="updateBill()" class="ml-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-1 rounded">
                Update Bill
            </button>
        </div>

        <!-- Bill container -->
        <div id="billContainer" class="space-y-4"></div>

        <!-- Print button -->
        <div class="mt-6 text-center">
            <button onclick="window.print()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded shadow">
                🖨️ Print Bill
            </button>
        </div>
    </div>

    <script>
        // Fetch latest order from localStorage
        const orderData = localStorage.getItem("latestOrder");
        let order = orderData ? JSON.parse(orderData) : null;

        function renderBill(tableNumber = '') {
            const container = document.getElementById("billContainer");

            if (!order) {
                container.innerHTML = "<p class='text-center text-gray-600'>No order found. Please place an order first.</p>";
                return;
            }

            const date = new Date(order.time || new Date());
            const timeString = date.toLocaleString();

            let html = `<p class="text-gray-500 mb-2 text-center">Order placed on: <strong>${timeString}</strong></p>`;
            if (tableNumber) {
                html += `<p class="text-gray-700 mb-4 text-center font-semibold">Table Number: ${tableNumber}</p>`;
            }

            html += `<table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-300">
                                <th class="py-2">Item</th>
                                <th class="py-2">Qty</th>
                                <th class="py-2">Price</th>
                                <th class="py-2">Total</th>
                            </tr>
                        </thead>
                        <tbody>`;

            order.items.forEach(item => {
                const qty = item.qty || item.quantity || 1;
                const total = item.price * qty;
                html += `
                    <tr class="border-b border-gray-200">
                        <td class="py-2">${item.name}</td>
                        <td class="py-2">${qty}</td>
                        <td class="py-2">Rs.${Number(item.price).toFixed(2)}</td>
                        <td class="py-2">Rs.${Number(total).toFixed(2)}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            html += `<p class="mt-4 text-right font-bold text-xl">Grand Total: Rs.${Number(order.total).toFixed(2)}</p>`;
            html += `<p class="mt-6 text-center text-gray-600">Thank you for dining with 🍴 My Restaurant!</p>`;

            container.innerHTML = html;
        }

        // Initial render
        renderBill();

        // Update bill when table number is entered
        function updateBill() {
            const tableNumber = document.getElementById("tableNumber").value;
            renderBill(tableNumber);
        }
    </script>
</body>
</html>
