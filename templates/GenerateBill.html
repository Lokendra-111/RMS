<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Bill - My Restaurant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body {
        background: white !important;
      }
      .no-print {
        display: none;
      }
      .print-area {
        box-shadow: none !important;
        border: none !important;
      }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-6 flex flex-col items-center">

  <!-- Back Button -->
  <a href="{{ url_for('dashboard') }}" class="no-print mb-4 text-blue-600 hover:underline text-xl font-medium self-start">
    ⬅️ Back to Dashboard
  </a>

  <div class="print-area w-full max-w-md bg-white p-6 rounded-2xl shadow-lg border border-gray-200">
    <!-- Restaurant Header -->
    <div class="text-center mb-6 border-b pb-3">
      <h1 class="text-3xl font-bold text-gray-800">🍴 My Restaurant</h1>
      <p class="text-gray-600 text-sm">Main Road, City Center</p>
      <p class="text-gray-600 text-sm">Phone: +977-9800000000</p>
    </div>

    <!-- Table number input -->
    <div class="no-print mb-6 text-center">
      <label for="tableNumber" class="mr-2 font-medium text-gray-700">Enter Table Number:</label>
      <input type="number" id="tableNumber" min="1" placeholder="Table #" class="border rounded px-3 py-1 w-24">
      <button onclick="updateBill()" class="ml-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-1 rounded">
        Update Bill
      </button>
    </div>

    <!-- Bill Content -->
    <div id="billContainer"></div>

    <!-- Footer & Print Button -->
    <div class="mt-6 text-center no-print">
      <button onclick="window.print()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded shadow">
        🖨️ Print Bill
      </button>
    </div>
  </div>

  <script>
    // Load order data
    const orderData = localStorage.getItem("latestOrder");
    let order = orderData ? JSON.parse(orderData) : null;
    let currentTableNumber = "";

    function renderBill(tableNumber = '') {
      const container = document.getElementById("billContainer");

      if (!order) {
        container.innerHTML = "<p class='text-center text-gray-600'>No order found. Please place an order first.</p>";
        return;
      }

      const date = new Date(order.time || new Date());
      const timeString = date.toLocaleString();

      let html = `
        <div class="text-center mb-4">
          <p class="text-gray-600 text-sm">Date: <strong>${timeString}</strong></p>
          ${tableNumber ? `<p class="text-gray-700 font-semibold text-lg mt-1">Table No: ${tableNumber}</p>` : ""}
        </div>

        <table class="w-full text-left border-collapse mb-4">
          <thead>
            <tr class="border-b border-gray-300">
              <th class="py-2 text-gray-700">Item</th>
              <th class="py-2 text-gray-700 text-center">Qty</th>
              <th class="py-2 text-gray-700 text-right">Price</th>
              <th class="py-2 text-gray-700 text-right">Total</th>
            </tr>
          </thead>
          <tbody>
      `;

      order.items.forEach(item => {
        const qty = item.qty || item.quantity || 1;
        const total = item.price * qty;
        html += `
          <tr class="border-b border-gray-200">
            <td class="py-1">${item.name}</td>
            <td class="py-1 text-center">${qty}</td>
            <td class="py-1 text-right">Rs.${Number(item.price).toFixed(2)}</td>
            <td class="py-1 text-right">Rs.${Number(total).toFixed(2)}</td>
          </tr>
        `;
      });

      html += `
          </tbody>
        </table>

        <div class="text-right border-t pt-2">
          <p class="font-semibold text-lg text-gray-800">Grand Total: Rs.${Number(order.total).toFixed(2)}</p>
        </div>

        <div class="mt-6 text-center border-t pt-3">
          <p class="text-gray-600 text-sm">Thank you for dining with us!</p>
          <p class="text-gray-600 text-sm">Please visit again 🍽️</p>
        </div>
      `;

      container.innerHTML = html;
    }

    // Initial render
    renderBill();

    // Update bill with table number + save to database
    function updateBill() {
      const tableNumber = document.getElementById("tableNumber").value;
      if (!tableNumber) {
        alert("⚠️ Please enter a table number before updating.");
        return;
      }

      currentTableNumber = tableNumber;
      renderBill(tableNumber);

      //  Send data to Flask backend to save in DB
      fetch("/saveBill", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          table_number: tableNumber,
          items: order.items,
          total: order.total
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert("✅ Bill saved to database successfully!");
        } else {
          alert("❌ Failed to save bill. Please try again.");
        }
      })
      .catch(err => {
        console.error("Error saving bill:", err);
        alert("⚠️ Error saving bill to server.");
      });
    }
  </script>

</body>
</html>
