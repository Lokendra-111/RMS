<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Manage Menu - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">

  <!-- Back to Dashboard -->
  <a href="{{ url_for('dashboard') }}" class="inline-block mb-4 text-blue-600 hover:underline text-xl font-medium">
    ⬅️ Back to Dashboard
  </a>

  <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow">
    <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">🍴 Manage Restaurant Menu</h1>

    <!-- Add Item Form -->
    <form id="menuForm" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block mb-1 font-medium">Food Name:</label>
        <input type="text" id="foodName" required class="border w-full px-3 py-2 rounded" placeholder="Enter food name" />
      </div>

      <div>
        <label class="block mb-1 font-medium">Price (Rs):</label>
        <input type="number" id="foodPrice" required class="border w-full px-3 py-2 rounded" placeholder="Enter price" />
      </div>

      <div>
        <label class="block mb-1 font-medium">Category:</label>
        <select id="foodCategory" required class="border w-full px-3 py-2 rounded">
          <option value="">--Select--</option>
          <option value="starters">Starters</option>
          <option value="main">Main</option>
          <option value="desserts">Desserts</option>
          <option value="drinks">Drinks</option>
        </select>
      </div>

      <div>
        <label class="block mb-1 font-medium">Image:</label>
        <input type="file" id="foodImage" accept="image/*" class="border w-full px-3 py-2 rounded" />
      </div>

      <div class="col-span-full text-center mt-2">
        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded">
          ➕ Add to Menu
        </button>
      </div>
    </form>

    <!-- Menu List -->
    <h2 class="text-2xl font-semibold mb-4 text-gray-700">📋 Current Menu</h2>
    <div id="menuList" class="grid sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
  </div>

  <script>
    const menuForm = document.getElementById("menuForm");
    const menuList = document.getElementById("menuList");

    // Load existing menu
    let menu = JSON.parse(localStorage.getItem("restaurantMenu")) || [];

    // Render Menu Items
    function renderMenu() {
      menuList.innerHTML = "";
      if (menu.length === 0) {
        menuList.innerHTML = `<p class="col-span-full text-center text-gray-500">No items added yet.</p>`;
        return;
      }

      menu.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "bg-gray-50 rounded p-4 shadow hover:shadow-md";
        div.innerHTML = `
          <img src="${item.image}" class="rounded mb-3 w-full h-48 object-cover">
          <h3 class="text-xl font-semibold">${item.name}</h3>
          <p class="text-gray-600 capitalize">${item.category}</p>
          <p class="font-bold text-green-600">Rs ${item.price}</p>
          <button onclick="deleteItem(${index})" class="mt-3 bg-red-600 hover:bg-red-700 text-white px-4 py-1 rounded text-sm">🗑️ Delete</button>
        `;
        menuList.appendChild(div);
      });
    }

    // Add Menu Item
    menuForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const name = document.getElementById("foodName").value.trim();
      const price = parseFloat(document.getElementById("foodPrice").value);
      const category = document.getElementById("foodCategory").value;
      const imageInput = document.getElementById("foodImage");

      if (!name || !price || !category) {
        alert("Please fill all required fields.");
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        const image = reader.result || "../static/images/noimage.png";
        const newItem = { name, price, category, image };
        menu.push(newItem);
        localStorage.setItem("restaurantMenu", JSON.stringify(menu));
        renderMenu();
        menuForm.reset();
      };

      if (imageInput.files[0]) reader.readAsDataURL(imageInput.files[0]);
      else {
        const newItem = { name, price, category, image: "../static/images/noimage.png" };
        menu.push(newItem);
        localStorage.setItem("restaurantMenu", JSON.stringify(menu));
        renderMenu();
        menuForm.reset();
      }
    });

    // Delete Menu Item
    function deleteItem(index) {
      if (confirm("Are you sure you want to delete this item?")) {
        menu.splice(index, 1);
        localStorage.setItem("restaurantMenu", JSON.stringify(menu));
        renderMenu();
      }
    }

    renderMenu();
  </script>
</body>
</html>
