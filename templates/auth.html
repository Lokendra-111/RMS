<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Create Account - RMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 min-h-screen flex items-center justify-center font-sans">
  <div class="bg-white shadow-xl rounded-2xl w-96 p-8">
    <div class="flex mb-6">
      <button class="flex-1 py-2 px-4 font-semibold rounded-t-2xl tab active text-white bg-blue-600 hover:bg-blue-700 transition" onclick="showTab('login')">Login</button>
      <button class="flex-1 py-2 px-4 font-semibold rounded-t-2xl tab text-blue-600 bg-gray-100 hover:bg-gray-200 transition" onclick="showTab('signup')">Sign Up</button>
    </div>

    <!-- Login Form -->
    <div id="login" class="tab-content block">
      <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Welcome Back</h2>
      <form action="/login" method="POST" class="space-y-4">
        <input type="text" name="username" placeholder="Username" required
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="password" name="password" placeholder="Password" required
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit" class="w-full py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition">Login</button>
      </form>
      <p class="text-sm text-gray-500 mt-4 text-center">Don't have an account? <span class="text-blue-600 font-semibold cursor-pointer" onclick="showTab('signup')">Sign Up</span></p>
    </div>

    <!-- Signup Form -->
    <div id="signup" class="tab-content hidden">
      <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Create Account</h2>
      <form action="/signup" method="POST" onsubmit="return validateSignup()" class="space-y-4">
        <input type="text" name="fullname" placeholder="Full Name" required
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="text" name="username" placeholder="Username" required
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="password" id="password" name="password" placeholder="Password" required
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit" class="w-full py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition">Register</button>
      </form>
      <p class="text-sm text-gray-500 mt-4 text-center">Already have an account? <span class="text-blue-600 font-semibold cursor-pointer" onclick="showTab('login')">Login</span></p>
    </div>
  </div>

  <script>
    function validateSignup() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm_password").value;
      const strongPasswordPattern =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?#&])[A-Za-z\d@$!%*?#&]{8,}$/;

      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return false;
      }
      if (!strongPasswordPattern.test(password)) {
        alert(
          "Password must be at least 8 characters long and include an uppercase letter, a lowercase letter, a number, and a special character."
        );
        return false;
      }
      return true;
    }

    function showTab(id) {
      document.querySelectorAll(".tab-content").forEach((el) => {
        el.classList.add("hidden");
        el.classList.remove("block");
      });
      document.querySelectorAll(".tab").forEach((el) => el.classList.remove("bg-blue-600", "text-white"));
      document.getElementById(id).classList.remove("hidden");
      document.getElementById(id).classList.add("block");

      // Highlight active tab
      if (id === 'login') {
        document.querySelectorAll('.tab')[0].classList.add("bg-blue-600", "text-white");
        document.querySelectorAll('.tab')[1].classList.remove("bg-blue-600", "text-white");
      } else {
        document.querySelectorAll('.tab')[1].classList.add("bg-blue-600", "text-white");
        document.querySelectorAll('.tab')[0].classList.remove("bg-blue-600", "text-white");
      }
    }
  </script>
</body>
</html>
