<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reserve Table</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-6">

  <a href="waiter.html" class="inline-block mb-6 text-blue-600 hover:underline text-xl font-medium">
    ⬅️ Back
  </a>

  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-6 max-w-6xl mx-auto">
    <!-- Boxes will be created by JS -->
  </div>

  <script>
    const grid = document.querySelector('.grid');

    for (let i = 1; i <= 10; i++) {
      const box = document.createElement('div');
      box.className =
        "bg-green-600 hover:bg-red-600 rounded-xl shadow-md p-6 text-center text-2xl font-bold text-white cursor-pointer transition duration-300 relative flex flex-col justify-center items-center square-box";
      box.innerHTML = `
        <div>${i}</div>
        <div class="action-buttons mt-4 hidden flex-col gap-2 fade-in">
          <button class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded">Place Order</button>
          <button class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded">Cancel</button>
        </div>
      `;

      grid.appendChild(box);

      const action = box.querySelector('.action-buttons');
      const placeBtn = action.querySelector('.bg-green-500');
      const cancelBtn = action.querySelector('.bg-red-500');

      box.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        action.classList.toggle('hidden');
      });

      placeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        alert(`✅ Order placed for Table #${i}`);
        window.location.href = "placeOrder.html";
      });

      cancelBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        alert(`❌ Reservation canceled for Table #${i}`);
        action.classList.add('hidden');
      });
    }
  </script>
</body>
</html>
