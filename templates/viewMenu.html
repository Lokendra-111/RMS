<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Restaurant Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .floating-btn {
      transition: bottom 0.4s ease-in-out;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans p-6 relative">
  <!-- Back Button -->
  <a href="#" onclick="window.location.href='{{ url_for('dashboard') }}';" 
     class="inline-block mb-4 text-blue-600 hover:underline text-xl font-medium">
    ⬅️ Back
  </a>

  <div class="max-w-6xl mx-auto">
    <h1 class="text-4xl font-bold text-center text-gray-800 mb-6">🍽️ Our Menu</h1>

    <!-- Search & Category Buttons -->
    <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
      <input id="search" type="text" placeholder="Search food..." 
             class="w-full sm:w-1/2 px-4 py-2 rounded border shadow" />
      <div class="flex flex-wrap gap-2">
        <button class="px-4 py-1 bg-blue-600 text-white rounded category-btn" data-category="all">All</button>
        <button class="px-4 py-1 bg-gray-200 rounded category-btn" data-category="starters">Starters</button>
        <button class="px-4 py-1 bg-gray-200 rounded category-btn" data-category="main">Main</button>
        <button class="px-4 py-1 bg-gray-200 rounded category-btn" data-category="desserts">Desserts</button>
        <button class="px-4 py-1 bg-gray-200 rounded category-btn" data-category="drinks">Drinks</button>
      </div>
    </div>

    <!-- Menu Grid -->
    <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-6" id="menu"></div>
  </div>

  <!--  Floating Cart Drawer -->
  <div id="cartDrawer" 
       class="fixed bottom-0 right-0 bg-white shadow-lg rounded-tl-2xl w-full sm:w-96 max-h-[80vh] overflow-y-auto transform translate-y-full transition-transform duration-500 ease-in-out">
    <div class="p-4 border-b flex justify-between items-center">
      <h2 class="text-xl font-semibold">🧾 Your Order</h2>
      <button onclick="toggleCart()" class="text-red-500 text-lg font-bold">✖</button>
    </div>

    <ul id="cartItems" class="p-4 space-y-3"></ul>

    <div class="p-4 border-t">
      <p class="text-lg font-bold text-gray-800">Total: Rs <span id="cartTotal">0</span></p>
      <div class="flex justify-between mt-4">
        <button onclick="clearCart()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded">Clear</button>
        <button onclick="placeOrder()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">Place Order</button>
      </div>
    </div>
  </div>

  <!-- Floating Cart Button -->
  <button onclick="toggleCart()" 
          class="floating-btn fixed bottom-6 right-6 bg-blue-600 text-white rounded-full px-5 py-3 shadow-lg hover:bg-blue-700">
    🛒 View Cart (<span id="cartCount">0</span>)
  </button>

  <!-- JavaScript -->
  <script>
    // Load menu dynamically from localStorage
    const storedMenu = JSON.parse(localStorage.getItem("restaurantMenu")) || [];
    const menuContainer = document.getElementById("menu");

    if (storedMenu.length === 0) {
      menuContainer.innerHTML = `
        <p class="col-span-full text-center text-gray-500 text-lg">
          No menu items found. Please add items from Manage Menu.
        </p>`;
    } else {
      storedMenu.forEach(item => {
        const card = document.createElement("div");
        card.className = "bg-white p-4 rounded shadow cursor-pointer hover:shadow-lg transition";
        card.setAttribute("data-category", item.category);
        card.setAttribute("data-name", item.name);
        card.setAttribute("data-price", item.price);

        card.innerHTML = `
          <img src="${item.image || '../static/images/noimage.png'}" 
               class="rounded mb-3 w-full h-60 object-cover" />
          <h2 class="text-xl font-semibold">${item.name}</h2>
          <p class="text-gray-600 text-sm capitalize">${item.category}</p>
          <div class="flex justify-between items-center mt-2">
            <span class="text-green-600 font-bold">Rs ${item.price}</span>
            <button class="bg-blue-600 text-white px-3 py-1 rounded text-sm add-btn">Add</button>
          </div>`;
        menuContainer.appendChild(card);
      });
    }

    // CATEGORY FILTER
    const buttons = document.querySelectorAll('.category-btn');
    const items = document.querySelectorAll('#menu > div');
    const search = document.getElementById('search');

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        const cat = button.getAttribute('data-category');
        buttons.forEach(b => b.classList.remove('bg-blue-600','text-white'));
        button.classList.add('bg-blue-600','text-white');
        const cards = document.querySelectorAll('#menu > div');
        cards.forEach(card => {
          const match = cat === 'all' || card.getAttribute('data-category') === cat;
          card.style.display = match ? 'block' : 'none';
        });
        search.value = '';
      });
    });

    // SEARCH FUNCTION
    search.addEventListener('input', () => {
      const q = search.value.toLowerCase();
      const cards = document.querySelectorAll('#menu > div');
      cards.forEach(card => {
        const name = card.querySelector('h2').innerText.toLowerCase();
        card.style.display = name.includes(q) ? 'block' : 'none';
      });
    });

    // CART FUNCTIONALITY
    let cart = [];
    let tableNumber = null;
    const cartDrawer = document.getElementById('cartDrawer');
    const cartItems = document.getElementById('cartItems');
    const cartCount = document.getElementById('cartCount');
    const cartTotal = document.getElementById('cartTotal');
    const cartButton = document.querySelector('.floating-btn');

    function toggleCart() {
      const isHidden = cartDrawer.classList.contains('translate-y-full');
      cartDrawer.classList.toggle('translate-y-full', !isHidden);
      cartButton.style.bottom = isHidden ? '80vh' : '1.5rem';
    }

    function updateCartUI() {
      cartItems.innerHTML = '';
      let total = 0;
      cart.forEach((item,index)=>{
        total += item.price * item.qty;
        const li = document.createElement('li');
        li.className = "flex justify-between items-center bg-gray-50 p-2 rounded shadow-sm";
        li.innerHTML = `
          <div>
            <p class="font-medium">${item.name}</p>
            <p class="text-sm text-gray-500">Rs ${item.price} × ${item.qty} = Rs ${item.price*item.qty}</p>
          </div>
          <div class="flex gap-2">
            <button class="bg-gray-200 px-2 rounded hover:bg-gray-300" onclick="decreaseQty(${index})">-</button>
            <button class="bg-gray-200 px-2 rounded hover:bg-gray-300" onclick="increaseQty(${index})">+</button>
            <button class="text-red-500 hover:text-red-700" onclick="removeItem(${index})">🗑️</button>
          </div>`;
        cartItems.appendChild(li);
      });
      cartCount.textContent = cart.length;
      cartTotal.textContent = total;
    }

    function addToCart(name, price){
      if(!tableNumber){
        tableNumber = prompt("Enter your Table Number:");
        if(!tableNumber || isNaN(tableNumber) || tableNumber <= 0){
          alert("Invalid Table Number!");
          tableNumber = null;
          return;
        }
      }
      const existing = cart.find(i=>i.name===name);
      if(existing) existing.qty++;
      else cart.push({name, price: parseFloat(price), qty:1});
      updateCartUI();
    }

    function increaseQty(index){ cart[index].qty++; updateCartUI();}
    function decreaseQty(index){ cart[index].qty--; if(cart[index].qty<=0) cart.splice(index,1); updateCartUI();}
    function removeItem(index){ cart.splice(index,1); updateCartUI();}
    function clearCart(){ cart=[]; tableNumber=null; updateCartUI();}

    function placeOrder(){
      if(cart.length===0){ alert("Your cart is empty!"); return; }
      const total = cart.reduce((sum,i)=>sum + i.price*i.qty,0);
      const order = { tableNumber, items: cart, total, timestamp:new Date().toISOString() };
      localStorage.setItem('latestOrder', JSON.stringify(order));
      alert(`✅ Order placed successfully for Table ${tableNumber}!`);
      clearCart();
      toggleCart();
    }

    // Add button handler
    document.addEventListener("click", (e) => {
      if (e.target.classList.contains("add-btn")) {
        const card = e.target.closest("[data-name]");
        addToCart(card.dataset.name, card.dataset.price);
      }
    });
  </script>
</body>
</html>
